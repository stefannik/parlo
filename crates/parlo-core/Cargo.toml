[package]
name = "parlo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["cpal-input", "mp3", "whisper", "tts-pocket"]
# Real microphone capture through cpal (CoreAudio on macOS, ALSA on Linux).
cpal-input = ["dep:cpal"]
# MP3 export through LAME (LGPL; needs a C compiler at build time).
mp3 = ["dep:mp3lame-encoder"]
# whisper.cpp through whisper-rs (needs cmake + a C++ compiler at build time).
whisper = ["dep:whisper-rs"]
# PocketTTS through the vendored/patched Candle port (crates/pocket-tts).
tts-pocket = ["dep:pocket-tts", "dep:candle-core"]
# Metal for PocketTTS (macOS only; unverified, see docs/MAC_HANDOFF.md).
tts-metal = ["tts-pocket", "pocket-tts/metal"]
# Metal GPU backend for whisper.cpp (macOS only).
whisper-metal = ["whisper", "whisper-rs/metal"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
hound = "3.5"
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-adapter-opus-rs = "0.1.1"
rubato = "5.0.1"
rtrb = "0.4"
crossbeam-channel = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
directories = "6"
libc = "0.2"
mp3lame-encoder = { version = "0.2.5", optional = true }
cpal = { version = "0.18", optional = true }
whisper-rs = { version = "0.16", optional = true, features = ["tracing_backend"] }
pocket-tts = { path = "../pocket-tts", optional = true }
candle-core = { version = "0.9.1", optional = true }
regex = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
encoding_rs = "0.8"
chardetng = "1"
pulldown-cmark = { version = "0.13", default-features = false }
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
