# Parlo build-time tool pins (scripts/fetch-tools.sh). Never commit the binaries (tools/yt-dlp/ is gitignored).
# yt-dlp is the *downloader for "Transcribe from URL"* (DECISIONS C-021, C-022). It runs as a child process; Parlo itself
# never opens a socket. Official standalone builds from https://github.com/yt-dlp/yt-dlp/releases — pinned by version +
# SHA-256 (the release's own SHA2-256SUMS file; re-verified here on download). They already contain the EJS challenge
# solver scripts, so no `--remote-components` download is ever needed; YouTube's JS challenges additionally need an
# external runtime (deno) which is *not* bundled (see C-022).
#
# `variant`: onedir (default; zip, unpacked next to the executable, ~0.45 s start on Linux) or onefile (single file,
# self-extracts on every launch, ~1.1 s start). Layout produced under tools/yt-dlp/: `yt-dlp` (+ `_internal/` for onedir).
# `size` is the download size in bytes (optional).

[meta]
schema = 1
generated = "2026-10-18"

[yt-dlp]
version = "2026.08.19"
base_url = "https://github.com/yt-dlp/yt-dlp/releases/download"
license = "Unlicense (yt-dlp); the bundled Python/libs keep their own licences (see the release notes)"
dest_dir = "yt-dlp"

