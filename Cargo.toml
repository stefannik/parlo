[workspace]
resolver = "2"
members = ["crates/parlo-core", "crates/parlo-cli", "crates/pocket-tts", "crates/parlo-macos", "src-tauri"]
exclude = ["spike"]
# src-tauri joins the workspace in Phase 4.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[profile.release]
lto = "thin"
codegen-units = 4
debug = false

[profile.dev]
# line tables only: full debuginfo made the target dir exceed the cloud disk allowance
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# Tests run the real-time pipeline (3 h soak etc.); keep them fast.
[profile.test]
opt-level = 2
debug = "line-tables-only"
