# Parlo model manifest. Source of truth for scripts/fetch-models.sh and (later) the runtime ModelPaths resolver.
# Every file: pinned revision, size and SHA-256 (verified on download). Never commit the files themselves.
# `dest` is relative to models/. Groups are selectable: fetch-models.sh --only <group>[,<group>...].
# Whisper/VAD hashes come from the HF LFS metadata of the pinned revision (re-verified on download).

[meta]
schema = 1
generated = "2026-10-14"

